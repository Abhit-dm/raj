# Nginx site for RajWorthman. Replace your-domain.com, then run certbot (see DEPLOY_VPS.md) to add HTTPS.
server {
    listen 80;
    server_name your-domain.com www.your-domain.com;

    root /var/www/rajworthman/frontend/dist;
    index index.html;

    client_max_body_size 10m;   # document uploads (backend limit is 5 MB)

    # API, uploaded files and app downloads are served by the Node backend
    location /api/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /uploads/ {
        proxy_pass http://127.0.0.1:3001;
    }
    location /downloads/ {
        proxy_pass http://127.0.0.1:3001;
    }

    # Long cache for hashed build assets
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # React router: send all other paths to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
