# Nginx site for RajWorthman on the demo VPS (187.77.178.120).
# The server already hosts another site on ports 80/443, so RajWorthman gets its own port: 8080.
#   Website + app download:  http://187.77.178.120:8080
#   API used by the app:     http://187.77.178.120:8080/api
# When a full domain points to this server (e.g. client-demo.example.com), add its name to
# server_name and switch to HTTPS with certbot (see DEPLOY_VPS.md, section 4).
server {
    listen 8080;
    listen [::]:8080;
    server_name 187.77.178.120 _;

    root /var/www/client-demo/frontend/dist;
    index index.html;

    client_max_body_size 10m;   # document uploads (backend limit is 5 MB)

    # API, uploaded files and app downloads are served by the Node backend
    location /api/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /uploads/ {
        proxy_pass http://127.0.0.1:3001;
    }
    location /downloads/ {
        proxy_pass http://127.0.0.1:3001;
    }

    # Long cache for hashed build assets
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # React router: send all other paths to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
